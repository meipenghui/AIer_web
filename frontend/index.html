<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIer - 智能编程中枢</title>
    <!-- 引入 Markdown 渲染和代码高亮 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        :root { 
            --bg: #050608; --panel: #0f1219; --border: #1e293b; 
            --primary: #38bdf8; --text: #f8fafc; --muted: #94a3b8; 
        }
        body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
        
        /* 全局输入框与按钮 */
        input { width: 100%; padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; color: white; outline: none; margin-bottom: 15px; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(56,189,248,0.2); }
        button { background: var(--primary); color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; }
        button:hover { background: #7dd3fc; box-shadow: 0 0 15px rgba(56,189,248,0.4); }
        button:disabled { background: #475569; cursor: not-allowed; }
        .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { border-color: var(--text); background: rgba(255,255,255,0.05); box-shadow: none; }
        
        /* 登录/注册容器 */
        .auth-container { margin: auto; background: var(--panel); padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .auth-tabs div { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: var(--muted); transition: 0.3s; }
        .auth-tabs div.active { color: var(--primary); border-bottom: 2px solid var(--primary); font-weight: bold; }
        
        /* 主体布局 */
        #main-app { display: none; width: 100%; height: 100%; }
        .sidebar { width: 280px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; }
        .sidebar h2 { font-size: 20px; margin-bottom: 30px; color: var(--primary); cursor: pointer; text-align: center; }
        .sidebar-menu { display: flex; flex-direction: column; gap: 10px; }
        .sidebar-menu div { padding: 12px; border-radius: 8px; cursor: pointer; color: var(--muted); transition: 0.2s; }
        .sidebar-menu div:hover, .sidebar-menu div.active { background: rgba(56,189,248,0.1); color: var(--primary); }
        
        /* 聊天区域 */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }
        .chat-header { padding: 15px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--panel); }
        .chat-box { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .msg { display: flex; max-width: 85%; }
        .msg.user { align-self: flex-end; }
        .msg.ai { align-self: flex-start; width: 100%; }
        .bubble { padding: 15px 20px; border-radius: 12px; line-height: 1.6; }
        .msg.user .bubble { background: var(--primary); color: #000; border-bottom-right-radius: 2px; }
        .msg.ai .bubble { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 2px; width: 100%; overflow-x: auto; }
        
        /* 工具调用状态条 */
        .tool-status { font-size: 13px; color: #f59e0b; margin-bottom: 8px; display: none; align-items: center; gap: 8px; }
        .tool-status::before { content: ''; display: inline-block; width: 8px; height: 8px; background: #f59e0b; border-radius: 50%; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* 输入区 */
        .input-area { padding: 20px 30px; border-top: 1px solid var(--border); background: var(--panel); display: flex; gap: 15px; }
        .input-area input { margin: 0; flex: 1; border-radius: 24px; padding: 15px 20px; }
        .input-area button { width: auto; border-radius: 24px; padding: 0 30px; }

        /* 状态抽屉 (Agent Status) */
        .status-drawer { position: absolute; right: -400px; top: 0; width: 400px; height: 100%; background: rgba(15, 18, 25, 0.95); backdrop-filter: blur(10px); border-left: 1px solid var(--border); transition: right 0.3s ease; padding: 30px; z-index: 100; box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
        .status-drawer.open { right: 0; }
        .status-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .status-card h4 { color: var(--muted); font-size: 13px; text-transform: uppercase; margin-bottom: 10px; }
        .status-card p { font-size: 24px; font-weight: bold; color: var(--primary); }
        .progress-bar { height: 6px; background: var(--border); border-radius: 3px; margin-top: 10px; overflow: hidden; }
        .progress-inner { height: 100%; background: var(--primary); transition: width 0.3s; }
        .sys-memory { font-size: 13px; color: var(--muted); line-height: 1.5; max-height: 200px; overflow-y: auto; background: #000; padding: 15px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; }
        
        /* 配置页面 */
        .config-container { flex: 1; padding: 40px; overflow-y: auto; display: flex; justify-content: center; }
        .config-form { width: 100%; max-width: 600px; background: var(--panel); padding: 40px; border-radius: 16px; border: 1px solid var(--border); }
        .config-form h3 { margin-bottom: 30px; color: var(--primary); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--muted); }
        
        /* Markdown 样式 */
        .bubble p { margin-bottom: 10px; }
        .bubble pre { background: #000; padding: 15px; border-radius: 8px; overflow-x: auto; margin: 10px 0; }
        .bubble code { font-family: monospace; background: rgba(255,255,255,0.1); padding: 2px 4px; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- ================= 登录/注册界面 ================= -->
    <div id="auth-view" class="auth-container">
        <h2 style="text-align: center; margin-bottom: 20px; color: var(--primary);">AIER SYSTEM</h2>
        <div class="auth-tabs">
            <div id="tab-login" class="active" onclick="switchAuth('login')">登录</div>
            <div id="tab-register" onclick="switchAuth('register')">注册</div>
        </div>
        
        <div id="form-login">
            <input type="text" id="login-username" placeholder="用户名">
            <input type="password" id="login-password" placeholder="密码">
            <button onclick="handleLogin()">登 录</button>
        </div>

        <div id="form-register" style="display: none;">
            <input type="text" id="reg-username" placeholder="用户名">
            <input type="password" id="reg-password" placeholder="密码">
            <input type="number" id="reg-age" placeholder="年龄 (选填)" value="18">
            <button onclick="handleRegister()">注 册</button>
        </div>
    </div>

    <!-- ================= 主应用界面 ================= -->
    <div id="main-app">
        <!-- 左侧边栏 -->
        <div class="sidebar">
            <h2>AIER TERMINAL</h2>
            <div class="sidebar-menu">
                <div id="menu-chat" class="active" onclick="switchMainView('chat')">💬 智能对话</div>
                <div id="menu-config" onclick="switchMainView('config')">⚙️ 模型配置</div>
                <div onclick="logout()" style="margin-top: auto; color: #ef4444;">🚪 退出登录</div>
            </div>
        </div>

        <!-- 对话区域 -->
        <div id="chat-view" class="chat-area">
            <div class="chat-header">
                <span id="chat-title">新的会话 (Thread: 1)</span>
                <button class="btn-secondary" style="width: auto; padding: 8px 16px;" onclick="toggleStatus()">📊 查看 Agent 状态</button>
            </div>
            <div class="chat-box" id="chat-box">
                <div class="msg ai">
                    <div class="bubble">你好！我是 AIer。我已准备好为你编写代码。请在下方输入指令。</div>
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="chat-input" placeholder="输入指令..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button id="send-btn" onclick="sendMessage()">发送</button>
            </div>
            
            <!-- 状态抽屉 (隐藏) -->
            <div id="status-drawer" class="status-drawer">
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                    <h3>Agent 运行状态</h3>
                    <span style="cursor: pointer;" onclick="toggleStatus()">✖</span>
                </div>
                <div class="status-card">
                    <h4>当前上下文占用</h4>
                    <p id="st-token-percent">0%</p>
                    <div class="progress-bar"><div id="st-token-bar" class="progress-inner" style="width: 0%"></div></div>
                    <div style="font-size: 12px; color: var(--muted); margin-top: 8px;">
                        估算: <span id="st-token-count">0</span> / <span id="st-token-limit">1000000</span> Tokens
                    </div>
                </div>
                <div class="status-card" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div><h4>对话轮数</h4><p id="st-msg-count">0</p></div>
                    <div><h4>工具调用</h4><p id="st-tool-count">0</p></div>
                </div>
                <div class="status-card">
                    <h4>当前注入的系统提示词</h4>
                    <div id="st-sys-msg" class="sys-memory">暂无数据</div>
                </div>
            </div>
        </div>

        <!-- 配置区域 -->
        <div id="config-view" class="config-container" style="display: none;">
            <div class="config-form">
                <h3>智能体模型配置</h3>
                <div class="form-group">
                    <label>模型提供商 (Provider)</label>
                    <input type="text" id="cfg-provider" value="deepseek" placeholder="如: deepseek, openai">
                </div>
                <div class="form-group">
                    <label>模型名称 (Model)</label>
                    <input type="text" id="cfg-model" value="deepseek-chat">
                </div>
                <div class="form-group">
                    <label>API Key 列表 (每行一个)</label>
                    <input type="password" id="cfg-apikeys" placeholder="sk-xxxxxx">
                </div>
                <div class="form-group">
                    <label>Base URL (选填，留空使用默认)</label>
                    <input type="text" id="cfg-baseurl" placeholder="https://api.deepseek.com">
                </div>
                
                <button onclick="saveConfig()" style="margin-top: 20px;">保存配置</button>
                <button class="btn-secondary" style="margin-top: 10px;" onclick="useDefaultConfig()">使用默认配置并开始对话</button>
            </div>
        </div>
    </div>

    <script>
        // ================= 全局状态 =================
        const API_BASE = "http://localhost:8080";
        let token = localStorage.getItem("token");
        let currentThreadId = 1;

        // ================= 页面初始化 =================
        window.onload = () => {
            if (token) showMainApp();
        };

        function showMainApp() {
            document.getElementById("auth-view").style.display = "none";
            document.getElementById("main-app").style.display = "flex";
        }

        function switchAuth(type) {
            document.getElementById("tab-login").className = type === 'login' ? 'active' : '';
            document.getElementById("tab-register").className = type === 'register' ? 'active' : '';
            document.getElementById("form-login").style.display = type === 'login' ? 'block' : 'none';
            document.getElementById("form-register").style.display = type === 'register' ? 'block' : 'none';
        }

        function switchMainView(view) {
            document.getElementById("menu-chat").className = view === 'chat' ? 'active' : '';
            document.getElementById("menu-config").className = view === 'config' ? 'active' : '';
            document.getElementById("chat-view").style.display = view === 'chat' ? 'flex' : 'none';
            document.getElementById("config-view").style.display = view === 'config' ? 'flex' : 'none';
        }

        function logout() {
            localStorage.removeItem("token");
            token = null;
            location.reload();
        }

        function showToast(msg, isError = false) {
            alert((isError ? "❌ " : "✅ ") + msg);
        }

        // ================= API 交互：认证 =================
        async function handleLogin() {
            const username = document.getElementById("login-username").value;
            const password = document.getElementById("login-password").value;
            try {
                const res = await fetch(`${API_BASE}/api/login`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    token = data.access_token;
                    localStorage.setItem("token", token);
                    showMainApp();
                } else {
                    showToast(data.detail, true);
                }
            } catch (e) { showToast("网络错误", true); }
        }

        async function handleRegister() {
            const username = document.getElementById("reg-username").value;
            const password = document.getElementById("reg-password").value;
            // 兜底处理，如果没有年龄输入框或用户没填，默认给 18
            const ageInput = document.getElementById("reg-age");
            const age = ageInput && ageInput.value ? parseInt(ageInput.value) : 18;

            try {
                const res = await fetch(`${API_BASE}/api/register`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ username, password, age })
                });
                const data = await res.json();
                
                if (res.ok) {
                    showToast("注册成功，请登录");
                    switchAuth('login');
                } else {
                    // 处理 FastAPI 返回的 422 错误（此时的 data.detail 是一个数组）
                    if (Array.isArray(data.detail)) {
                        const errMsg = data.detail.map(e => e.msg).join(', ');
                        showToast(`注册失败：${errMsg}`, true);
                    } else {
                        showToast(data.detail, true);
                    }
                }
            } catch (e) { showToast("网络错误", true); }
        }

        // ================= API 交互：配置 =================
        async function saveConfig() {
            const provider = document.getElementById("cfg-provider").value;
            const model = document.getElementById("cfg-model").value;
            const keys = document.getElementById("cfg-apikeys").value.split('\n').filter(k => k.trim());
            const base_url = document.getElementById("cfg-baseurl").value || null;

            if (keys.length === 0) return showToast("请至少填写一个 API Key", true);

            const payload = {
                provider: provider,
                model: model,
                api_key_list: keys,
                base_url: base_url,
                temperature: 0.7,
                max_tokens: 8192,
                timeout: 60.0,
                max_retries: 2
            };

            try {
                const res = await fetch(`${API_BASE}/api/agent_config`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (res.ok) {
                    showToast(data.msg);
                    switchMainView('chat');
                } else {
                    showToast(data.detail, true);
                }
            } catch (e) { showToast("网络错误", true); }
        }

        function useDefaultConfig() {
            document.getElementById("cfg-apikeys").value = "";
            showToast("已切换为默认配置，跳转对话页...");
            switchMainView('chat');
        }

        // ================= API 交互：对话与 SSE =================
        async function sendMessage() {
            const input = document.getElementById("chat-input");
            const text = input.value.trim();
            if (!text) return;
            
            input.value = "";
            const chatBox = document.getElementById("chat-box");
            
            // 1. 渲染用户气泡
            chatBox.innerHTML += `<div class="msg user"><div class="bubble">${text}</div></div>`;
            
            // 2. 准备 AI 气泡
            const aiMsgDiv = document.createElement("div");
            aiMsgDiv.className = "msg ai";
            aiMsgDiv.innerHTML = `
                <div class="bubble">
                    <div class="tool-status" id="status-${Date.now()}">思考中...</div>
                    <div class="content"></div>
                </div>`;
            chatBox.appendChild(aiMsgDiv);
            
            const statusDiv = aiMsgDiv.querySelector('.tool-status');
            const contentDiv = aiMsgDiv.querySelector('.content');
            chatBox.scrollTop = chatBox.scrollHeight;

            document.getElementById("send-btn").disabled = true;

            try {
                const res = await fetch(`${API_BASE}/api/chat`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ message: text, thread_id: currentThreadId })
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";
                let fullMarkdown = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n\n");
                    buffer = lines.pop(); // 留下半截包

                    for (let line of lines) {
                        if (line.startsWith("data: ")) {
                            const dataStr = line.replace("data: ", "").trim();
                            if (dataStr === "[DONE]") break;
                            
                            try {
                                const data = JSON.parse(dataStr);
                                if (data.text) {
                                    statusDiv.style.display = "none";
                                    fullMarkdown += data.text;
                                    // 使用 marked 渲染并防 XSS
                                    contentDiv.innerHTML = DOMPurify.sanitize(marked.parse(fullMarkdown));
                                    chatBox.scrollTop = chatBox.scrollHeight;
                                } else if (data.status) {
                                    statusDiv.style.display = "flex";
                                    statusDiv.innerText = data.status;
                                } else if (data.type === "todos") {
                                    // 如果你需要展示待办事项，可以在这里处理
                                    console.log("更新了待办事项:", data.todos);
                                }
                            } catch (e) {}
                        }
                    }
                }
            } catch (e) {
                contentDiv.innerHTML += `<p style="color:red">❌ 连接中断</p>`;
            } finally {
                document.getElementById("send-btn").disabled = false;
                statusDiv.style.display = "none";
            }
        }

        // ================= API 交互：Agent 状态面板 =================
        function toggleStatus() {
            const drawer = document.getElementById("status-drawer");
            drawer.classList.toggle("open");
            if (drawer.classList.contains("open")) fetchAgentStatus();
        }

        async function fetchAgentStatus() {
            try {
                const res = await fetch(`${API_BASE}/api/agent/status?thread_id=${currentThreadId}`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (res.ok) {
                    document.getElementById("st-token-percent").innerText = `${data.usage_percentage}%`;
                    document.getElementById("st-token-bar").style.width = `${data.usage_percentage}%`;
                    document.getElementById("st-token-count").innerText = data.estimated_tokens;
                    document.getElementById("st-token-limit").innerText = data.context_window_limit;
                    
                    document.getElementById("st-msg-count").innerText = data.message_count;
                    document.getElementById("st-tool-count").innerText = data.tool_call_count;
                    
                    document.getElementById("st-sys-msg").innerText = data.system_message || "暂无注入数据";
                } else {
                    showToast(data.detail, true);
                }
            } catch (e) { showToast("获取状态失败", true); }
        }
    </script>
</body>
</html>
