server {
    listen 80;
    server_name localhost;

    # 1. 静态页面
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 2. 反向代理到后端容器
    location /api/ {
        # ⭐️ 这里的 backend 是我们在 docker-compose 里定义的后端服务名
        # Docker 内部 DNS 会自动把它解析为后端容器的 IP
        proxy_pass http://backend:8000;  
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}