services:
  backend:
    build: ./backend
    container_name: my_fastapi_backend
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - ${WORKSPACE_PATH:-./workspace}:/app/workspace 
      #- ./workspace:/app/workspace
    ports:
      - "8081:8000"
    command: >
      sh -c "pip install -r requirements.txt -i https://mirrors.aliyun.com/pypi/simple/ --trusted-host https://mirrors.aliyun.com && 
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    dns:
      - 8.8.8.8
      - 114.114.114.114
    #environment:
      # 👇 把数据库和 Redis 的连接地址注入给后端环境变量
      #- DATABASE_URL=postgresql+asyncpg://postgres:122122@db:5432/AIer_DB
      #- REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    image: nginx:alpine
    container_name: my_nginx_frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # ==========================================
  # 👇 新增 PostgreSQL 服务
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: my_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 122122
      POSTGRES_DB: AIer_Agent  # 👈 默认只创建这一个主库
    ports:
      - "5433:5432"         # 暴露给宿主机，方便你用 Navicat/DBeaver 连接
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  # ==========================================
  # 👇 新增 Redis 服务
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: my_redis
    ports:
      - "6378:6379"         # 暴露给宿主机，方便本地调试
    volumes:
      - redisdata:/data     # 持久化 Redis 数据
    restart: always

# ==========================================
#docker exec -it my_postgres bash
#psql -U postgres -d AIer_Agent
#CREATE DATABASE "AIer_Agent_Memory";
#\q
# 👇 声明数据卷（防止容器重启数据丢失）
# ==========================================
volumes:
  pgdata:
  redisdata: